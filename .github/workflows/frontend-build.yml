name: Frontend build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: storsight-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: storsight-frontend
        run: npm ci

      - name: Build frontend
        working-directory: storsight-frontend
        run: npm run build
